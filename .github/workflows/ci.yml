name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable credentials for the throwaway test servers below. Not secrets.
  MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
  TEST_ACCESS_KEY: ACCESS_KEY_EXAMPLE
  TEST_SECRET_KEY: SECRET_KEY_EXAMPLE

jobs:
  test:
    name: Lint, typecheck, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate package contents
        run: npm pack --dry-run

  e2e-minio:
    name: E2E MinIO (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      AWS_ACCESS_KEY_ID: ACCESS_KEY_EXAMPLE
      AWS_SECRET_ACCESS_KEY: SECRET_KEY_EXAMPLE
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3CC_E2E_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$TEST_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$TEST_SECRET_KEY" \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - name: Quick Start via npx (packed tarball)
        run: |
          npm pack
          aws --endpoint-url http://localhost:9000 s3 mb s3://test-bucket
          npx --yes ./s3-compat-check-*.tgz --endpoint http://localhost:9000 --bucket test-bucket
          npx --yes ./s3-compat-check-*.tgz --endpoint http://localhost:9000 --bucket test-bucket \
            --format json --output result.json
          node -e 'const r=require("./result.json"); if(!r.ok||r.summary.failed!==0) process.exit(1)'
      - name: Assert no test data remains
        run: |
          node --input-type=module -e '
            import { S3Client, ListObjectsV2Command, ListMultipartUploadsCommand } from "@aws-sdk/client-s3";
            const c = new S3Client({ endpoint: "http://localhost:9000", forcePathStyle: true });
            const o = await c.send(new ListObjectsV2Command({ Bucket: "test-bucket" }));
            const u = await c.send(new ListMultipartUploadsCommand({ Bucket: "test-bucket" }));
            const objects = o.Contents?.length ?? 0, uploads = u.Uploads?.length ?? 0;
            console.log({ objects, uploads });
            if (objects || uploads) process.exit(1);
          '

  e2e-seaweedfs:
    name: E2E SeaweedFS (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      AWS_ACCESS_KEY_ID: ACCESS_KEY_EXAMPLE
      AWS_SECRET_ACCESS_KEY: SECRET_KEY_EXAMPLE
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Start SeaweedFS
        run: |
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          cat > "$RUNNER_TEMP/seaweedfs/s3.json" <<EOF
          {"identities":[{"name":"admin","credentials":[{"accessKey":"$TEST_ACCESS_KEY","secretKey":"$TEST_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          docker run -d --name seaweedfs -p 8333:8333 -v "$RUNNER_TEMP/seaweedfs:/etc/seaweedfs-s3:ro" \
            "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/seaweedfs-s3/s3.json
          for _ in $(seq 1 90); do
            aws --endpoint-url http://localhost:8333 s3 mb s3://test-bucket 2>/dev/null && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1
      - run: npm ci
      - run: npm run build
      - run: node dist/bin.js --endpoint http://localhost:8333 --bucket test-bucket --verbose

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --no-banner --verbose .
      - name: Scan working tree
        run: ./gitleaks dir --redact --no-banner --verbose .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Verify registry signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
