name: Bug report
description: Report a problem with s3-compat-check
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, presigned URLs, internal hostnames or private bucket names.**
        Replace them with placeholders such as `storage.example.com` and `test-bucket`.
  - type: input
    id: version
    attributes:
      label: s3-compat-check version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Storage implementation and version
      placeholder: "MinIO RELEASE.2026-08-04, Ceph RGW 19.2, ..."
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "Node.js 22.12.0 on Ubuntu 24.04"
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with secrets and hostnames replaced.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of the command with `--verbose` (review it for private information first).
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
